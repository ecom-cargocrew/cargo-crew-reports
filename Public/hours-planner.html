<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warehouse Hours Planner</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap');
:root {
  --bg:#0d0f14; --surface:#141720; --surface2:#1c2030; --border:#252b3b;
  --accent:#4fffb0; --accent2:#ff6b6b; --accent3:#ffc857; --text:#e8ecf4;
  --muted:#6b7280; --positive:#4affb0; --negative:#ff6b6b;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:'DM Mono',monospace; min-height:100vh; padding:32px 24px; }
.header { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:32px; gap:24px; }
.eyebrow { font-size:10px; letter-spacing:4px; text-transform:uppercase; color:var(--accent); margin-bottom:8px; }
h1 { font-family:'Syne',sans-serif; font-size:clamp(24px,3.5vw,42px); font-weight:800; letter-spacing:-1px; line-height:1.1; }
.sub { font-size:11px; color:var(--muted); margin-top:6px; letter-spacing:1px; }
.back-btn { display:inline-flex; align-items:center; gap:7px; font-family:'DM Mono',monospace; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); text-decoration:none; padding:6px 12px; border:1px solid var(--border); border-radius:4px; transition:color .15s,border-color .15s; white-space:nowrap; }
.back-btn:hover { color:var(--accent); border-color:var(--accent); }
.controls { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin-bottom:24px; }
.ctrl-card { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:14px 16px; }
.ctrl-label { font-size:9px; letter-spacing:3px; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
.ctrl-input { background:var(--surface2); border:1px solid var(--border); border-radius:4px; color:var(--text); font-family:'DM Mono',monospace; font-size:14px; padding:8px 10px; width:100%; outline:none; transition:border-color .15s; }
.ctrl-input:focus { border-color:var(--accent); }
.ctrl-input[type="number"] { -moz-appearance:textfield; }
.ctrl-input[type="number"]::-webkit-inner-spin-button { display:none; }
.kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:24px; }
.kpi { background:var(--surface); border:1px solid var(--border); border-top:2px solid var(--border); border-radius:8px; padding:16px 18px; }
.kpi.good { border-top-color:var(--positive); }
.kpi.bad  { border-top-color:var(--negative); }
.kpi.hi   { border-top-color:var(--accent); }
.kpi.warn { border-top-color:var(--accent3); }
.kpi-label { font-size:9px; letter-spacing:3px; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
.kpi-value { font-family:'Syne',sans-serif; font-size:26px; font-weight:800; color:var(--text); line-height:1; }
.kpi-sub   { font-size:10px; color:var(--muted); margin-top:5px; }
.kpi-badge { font-size:10px; margin-top:6px; padding:2px 8px; border-radius:3px; display:inline-block; }
.kpi-badge.good { background:rgba(74,255,176,.12); color:var(--positive); }
.kpi-badge.bad  { background:rgba(255,107,107,.12); color:var(--negative); }
.week-bar { display:flex; gap:8px; margin-bottom:8px; align-items:center; }
.week-label-input { background:var(--surface2); border:1px solid var(--border); border-radius:4px; color:var(--accent); font-family:'DM Mono',monospace; font-size:10px; letter-spacing:1px; text-align:center; width:80px; padding:6px 4px; outline:none; cursor:text; }
.week-label-input:focus { border-color:var(--accent); background:var(--surface); }
.table-wrap { overflow-x:auto; margin-bottom:24px; }
table { width:100%; border-collapse:collapse; font-size:12px; min-width:700px; }
thead th { font-size:9px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); text-align:right; padding:0 10px 10px; border-bottom:1px solid var(--border); }
thead th:first-child { text-align:left; }
thead th.wk { color:var(--accent); }
tbody tr:hover td { background:var(--surface2); }
tbody tr.ft-row  td:first-child { border-left:2px solid var(--accent); }
tbody tr.pt-row  td:first-child { border-left:2px solid var(--accent3); }
tbody tr.cas-row td:first-child { border-left:2px solid #7b8cde; }
tfoot tr.totals-row td { border-top:2px solid var(--border); font-family:'Syne',sans-serif; font-weight:700; color:var(--text); padding-top:12px; }
td { padding:7px 10px; text-align:right; border-bottom:1px solid var(--border); color:var(--text); vertical-align:middle; }
td:first-child { text-align:left; }
.hrs-input { background:var(--surface2); border:1px solid var(--border); border-radius:3px; color:var(--text); font-family:'DM Mono',monospace; font-size:12px; padding:5px 6px; width:60px; text-align:center; outline:none; transition:border-color .15s; -moz-appearance:textfield; }
.hrs-input::-webkit-inner-spin-button { display:none; }
.hrs-input:focus { border-color:var(--accent); }
.hrs-input.zero { color:var(--muted); }
.name-input { background:transparent; border:none; color:var(--text); font-family:'DM Mono',monospace; font-size:12px; padding:0; width:200px; outline:none; }
.name-input:focus { border-bottom:1px solid var(--accent); }
.rate-input { background:transparent; border:none; color:var(--muted); font-family:'DM Mono',monospace; font-size:12px; padding:0; width:60px; text-align:right; outline:none; -moz-appearance:textfield; }
.rate-input::-webkit-inner-spin-button { display:none; }
.rate-input:focus { border-bottom:1px solid var(--accent); color:var(--text); }
.type-badge { font-size:9px; letter-spacing:1px; padding:2px 7px; border-radius:3px; cursor:pointer; user-select:none; }
.type-badge.FT  { background:rgba(79,255,176,.12); color:var(--accent);  border:1px solid var(--accent); }
.type-badge.PT  { background:rgba(255,200,87,.12);  color:var(--accent3); border:1px solid var(--accent3); }
.type-badge.CAS { background:rgba(123,140,222,.12); color:#7b8cde;        border:1px solid #7b8cde; }
.action-bar { display:flex; gap:10px; margin-bottom:24px; flex-wrap:wrap; align-items:center; }
.btn { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:2px; text-transform:uppercase; padding:8px 16px; border-radius:4px; cursor:pointer; transition:all .15s; border:1px solid var(--border); background:transparent; color:var(--muted); }
.btn:hover { border-color:var(--accent); color:var(--accent); }
.btn.primary { background:var(--accent); border-color:var(--accent); color:#0d0f14; font-weight:700; }
.btn.primary:hover { background:#3de89d; }
.btn.danger  { border-color:var(--negative); color:var(--negative); }
.btn.danger:hover  { background:rgba(255,107,107,.1); }
.saved-badge { font-size:10px; color:var(--positive); letter-spacing:1px; opacity:0; transition:opacity .3s; }
.saved-badge.show { opacity:1; }
.legend { display:flex; gap:16px; font-size:10px; color:var(--muted); }
.ldot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:5px; vertical-align:middle; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="eyebrow">Warehouse Operations</div>
    <h1>Hours Planner</h1>
    <div class="sub" id="plannerSub">Monthly staff hours planning &middot; Uni Hill HQ</div>
  </div>
  <a class="back-btn" href="index.html">&larr; Reports Hub</a>
</div>

<div class="controls">
  <div class="ctrl-card"><div class="ctrl-label">Planning Month</div><input type="month" class="ctrl-input" id="planMonth"></div>
  <div class="ctrl-card"><div class="ctrl-label">Target Units to Ship</div><input type="number" class="ctrl-input" id="targetUnits" value="45000" step="500"></div>
  <div class="ctrl-card"><div class="ctrl-label">Avg Units / Month (FY26)</div><input type="number" class="ctrl-input" id="avgUnits" value="42508" step="100"></div>
  <div class="ctrl-card"><div class="ctrl-label">Target Cost / Unit ($)</div><input type="number" class="ctrl-input" id="targetCpu" value="1.00" step="0.05"></div>
</div>

<div class="kpi-row" id="kpiRow"></div>

<div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:16px;">
  <div style="font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;">Week Labels &mdash; click to edit</div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
    <input class="week-label-input" id="wk1label" value="Wk 1" oninput="renderTable()" onclick="this.select()">
    <input class="week-label-input" id="wk2label" value="Wk 2" oninput="renderTable()" onclick="this.select()">
    <input class="week-label-input" id="wk3label" value="Wk 3" oninput="renderTable()" onclick="this.select()">
    <input class="week-label-input" id="wk4label" value="Wk 4" oninput="renderTable()" onclick="this.select()">
    <input class="week-label-input" id="wk5label" value="Wk 5" oninput="renderTable()" onclick="this.select()">
    <span style="font-size:10px;color:var(--muted);margin-left:8px;">e.g. "2&ndash;8 Jun"</span>
  </div>
</div>

<div class="action-bar">
  <button class="btn primary" onclick="exportCSV()">&#8659; Export Plan</button>
  <button class="btn" onclick="addRow()">+ Add Person</button>
  <button class="btn" onclick="clearHours()">Clear Hours</button>
  <button class="btn danger" onclick="resetAll()">Reset All</button>
  <span class="saved-badge" id="savedBadge">&#10003; Saved</span>
  <div class="legend" style="margin-left:auto;">
    <span><span class="ldot" style="background:var(--accent)"></span>FT</span>
    <span><span class="ldot" style="background:var(--accent3)"></span>PT</span>
    <span><span class="ldot" style="background:#7b8cde"></span>Casual</span>
  </div>
</div>

<div class="table-wrap">
  <table>
    <thead><tr>
      <th style="min-width:200px;">Name</th>
      <th>Type</th>
      <th class="wk" id="th-wk1">Wk 1</th>
      <th class="wk" id="th-wk2">Wk 2</th>
      <th class="wk" id="th-wk3">Wk 3</th>
      <th class="wk" id="th-wk4">Wk 4</th>
      <th class="wk" id="th-wk5">Wk 5</th>
      <th>Total Hrs</th>
      <th>Est. Cost</th>
      <th style="width:30px;"></th>
    </tr></thead>
    <tbody id="rosterBody"></tbody>
    <tfoot id="rosterFoot"></tfoot>
  </table>
</div>

<script>
const DEFAULT_ROSTER = [
  {name:"Tom Wilkins",               type:"FT", rate:31.77, wk:[38,38,38,36,0]},
  {name:"Stephen Nicolaidis",        type:"FT", rate:28.81, wk:[38,38,38,36,0]},
  {name:"Emma Spiden",               type:"FT", rate:34.15, wk:[37,37,37,36,0]},
  {name:"Michelle Rowe",             type:"FT", rate:49.92, wk:[36,36,36,35,0]},
  {name:"George Gibilisco",          type:"FT", rate:31.40, wk:[34,34,34,35,0]},
  {name:"Edward Murphy",             type:"FT", rate:29.77, wk:[29,29,29,28,0]},
  {name:"Gregory Matheson",          type:"FT", rate:30.76, wk:[26,26,26,24,0]},
  {name:"Yamali Y Karuna Munige Sirisena", type:"FT", rate:28.35, wk:[24,24,24,24,0]},
  {name:"Bernadette O'Brien",        type:"PT", rate:36.91, wk:[18,18,18,19,0]},
  {name:"Vittoria Gibilisco",        type:"PT", rate:33.59, wk:[13,13,13,12,0]},
  {name:"Judey Calou",               type:"PT", rate:36.72, wk:[12,12,12,11,0]},
  {name:"Amy-Kate Crouch",           type:"PT", rate:34.56, wk:[10,10,10,11,0]},
  {name:"Diliru Samujith Batugahage Don", type:"PT", rate:33.64, wk:[6,6,6,4,0]},
  {name:"Amber Jenkins",             type:"PT", rate:24.00, wk:[6,6,6,4,0]},
  {name:"Grace Alberti",             type:"PT", rate:24.00, wk:[6,6,6,4,0]},
  {name:"Billy De Nittis",           type:"CAS", rate:30.00, wk:[0,0,0,0,0]},
  {name:"Nicholas Radatti",          type:"CAS", rate:29.40, wk:[0,0,0,0,0]},
];

let roster = [];

function getCurrentMonth() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
}

const SHEET_ID = '17z_x6F8_QOUwo7Rtk6Sj5nBbAU6rvasibGk261fMcsQ';
const COST_URL = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&sheet=Warehouse%20throughput%20-%20Cost';
const SKIP_TYPES = new Set(['ETP Tax Withheld','Part Period Reduction','Back Pay','Bernadette Finance','Higher Duties']);

async function fetchRates() {
  try {
    const res  = await fetch(COST_URL);
    const text = await res.text();
    const lines = text.split('\n').filter(function(l) { return l.trim(); });
    const header = lines[0].match(/(".*?"|[^,]+)/g).map(function(c) { return c.replace(/"/g,'').trim().toLowerCase(); });
    const cName  = header.findIndex(function(h) { return h === 'employee'; });
    const cDept  = header.findIndex(function(h) { return h.includes('department'); });
    const cSub   = header.findIndex(function(h) { return h.includes('sub type'); });
    const cRate  = header.findIndex(function(h) { return h === 'rate'; });
    const cEnd   = header.findIndex(function(h) { return h.includes('end date'); });

    var rateMap = {}; // name -> { total, count, latestDate }

    lines.slice(1).forEach(function(line) {
      var cols = line.match(/(".*?"|[^,]+)/g);
      if (!cols) return;
      cols = cols.map(function(c) { return c.replace(/"/g,'').trim(); });
      var dept = cols[cDept] || '', sub = cols[cSub] || '';
      var name = cols[cName] || '', rate = parseFloat(cols[cRate]) || 0;
      var endStr = cols[cEnd] || '';
      if (dept !== 'Warehouse' || SKIP_TYPES.has(sub) || !name || rate <= 0) return;
      // Parse end date
      var parts = endStr.split('/');
      if (parts.length < 3) return;
      var endDate = new Date(parts[2] + '-' + parts[1].padStart(2,'0') + '-' + parts[0].padStart(2,'0'));
      if (isNaN(endDate)) return;
      if (!rateMap[name] || endDate > rateMap[name].latestDate) {
        rateMap[name] = { rate: rate, latestDate: endDate };
      }
    });

    // Update roster rates from sheet
    var updated = 0;
    roster.forEach(function(p) {
      if (rateMap[p.name]) {
        p.rate = Math.round(rateMap[p.name].rate * 100) / 100;
        updated++;
      }
    });
    if (updated > 0) {
      renderKPI();
      renderTable();
    }
    return updated;
  } catch(e) {
    console.warn('Could not fetch rates:', e);
    return 0;
  }
}

function load() {
  try {
    const saved = localStorage.getItem("cc_hours_planner");
    if (saved) {
      const data = JSON.parse(saved);
      roster = data.roster || JSON.parse(JSON.stringify(DEFAULT_ROSTER));
      roster.forEach(function(p) { if (p.wk.length < 5) p.wk.push(0); });
      document.getElementById("planMonth").value   = data.planMonth   || getCurrentMonth();
      document.getElementById("targetUnits").value = data.targetUnits || 45000;
      document.getElementById("avgUnits").value    = data.avgUnits    || 42508;
      document.getElementById("targetCpu").value   = data.targetCpu   || 1.00;
      document.getElementById("wk1label").value    = data.wk1label    || "Wk 1";
      document.getElementById("wk2label").value    = data.wk2label    || "Wk 2";
      document.getElementById("wk3label").value    = data.wk3label    || "Wk 3";
      document.getElementById("wk4label").value    = data.wk4label    || "Wk 4";
      document.getElementById("wk5label").value    = data.wk5label    || "Wk 5";
    } else {
      roster = JSON.parse(JSON.stringify(DEFAULT_ROSTER));
      document.getElementById("planMonth").value = getCurrentMonth();
    }
  } catch(e) {
    roster = JSON.parse(JSON.stringify(DEFAULT_ROSTER));
    document.getElementById("planMonth").value = getCurrentMonth();
  }
}

function autoSave() {
  try {
    const data = {
      roster,
      planMonth:   document.getElementById("planMonth").value,
      targetUnits: +document.getElementById("targetUnits").value,
      avgUnits:    +document.getElementById("avgUnits").value,
      targetCpu:   +document.getElementById("targetCpu").value,
      wk1label:    document.getElementById("wk1label").value,
      wk2label:    document.getElementById("wk2label").value,
      wk3label:    document.getElementById("wk3label").value,
      wk4label:    document.getElementById("wk4label").value,
      wk5label:    document.getElementById("wk5label").value,
    };
    localStorage.setItem("cc_hours_planner", JSON.stringify(data));
    const badge = document.getElementById("savedBadge");
    badge.classList.add("show");
    setTimeout(function() { badge.classList.remove("show"); }, 2000);
  } catch(e) {}
}

let saveTimer;
function deferSave() { clearTimeout(saveTimer); saveTimer = setTimeout(autoSave, 1500); }

function calcTotals() {
  const targetUnits = +document.getElementById("targetUnits").value || 0;
  const targetCpu   = +document.getElementById("targetCpu").value   || 1.00;
  let totalHrs = 0, totalCost = 0, ftHrs = 0, ptHrs = 0, casHrs = 0;
  roster.forEach(function(p) {
    const hrs  = p.wk.reduce(function(s,h) { return s + (+h||0); }, 0);
    const cost = hrs * (p.rate||0);
    totalHrs  += hrs; totalCost += cost;
    if      (p.type === "FT")  ftHrs  += hrs;
    else if (p.type === "PT")  ptHrs  += hrs;
    else                       casHrs += hrs;
  });
  const projCpu = targetUnits > 0 ? totalCost / targetUnits : null;
  const projUph = totalHrs   > 0 ? targetUnits / totalHrs  : null;
  return { totalHrs, totalCost, projCpu, projUph, targetCpu, targetUnits, ftHrs, ptHrs, casHrs };
}

function renderKPI() {
  const t = calcTotals();
  const cpuGood    = t.projCpu !== null && t.projCpu <= t.targetCpu;
  const avgHrsRef  = 1372;
  const hrsVsRef   = t.totalHrs > 0 ? ((t.totalHrs - avgHrsRef) / avgHrsRef * 100).toFixed(1) : null;
  document.getElementById("kpiRow").innerHTML =
    '<div class="kpi ' + (t.projCpu === null ? "hi" : cpuGood ? "good" : "bad") + '">' +
      '<div class="kpi-label">Projected Cost / Unit</div>' +
      '<div class="kpi-value">' + (t.projCpu !== null ? "$" + t.projCpu.toFixed(2) : "&mdash;") + "</div>" +
      '<div class="kpi-sub">at ' + t.targetUnits.toLocaleString() + " units</div>" +
      (t.projCpu !== null ? '<div class="kpi-badge ' + (cpuGood ? "good" : "bad") + '">' + (cpuGood ? "&#10003; Under $" : "&#9650; Over $") + t.targetCpu.toFixed(2) + "</div>" : "") +
    "</div>" +
    '<div class="kpi hi">' +
      '<div class="kpi-label">Total Hours Planned</div>' +
      '<div class="kpi-value">' + t.totalHrs.toLocaleString() + "</div>" +
      '<div class="kpi-sub">FY26 avg: ' + avgHrsRef.toLocaleString() + " hrs" + (hrsVsRef !== null ? " (" + (hrsVsRef >= 0 ? "+" : "") + hrsVsRef + "%)" : "") + "</div>" +
    "</div>" +
    '<div class="kpi">' +
      '<div class="kpi-label">Projected Labour Cost</div>' +
      '<div class="kpi-value">$' + Math.round(t.totalCost).toLocaleString() + "</div>" +
      '<div class="kpi-sub">at planned hours &amp; rates</div>' +
    "</div>" +
    '<div class="kpi">' +
      '<div class="kpi-label">Est. Units / Hr</div>' +
      '<div class="kpi-value">' + (t.projUph !== null ? t.projUph.toFixed(1) : "&mdash;") + "</div>" +
      '<div class="kpi-sub">target &divide; planned hours</div>' +
    "</div>" +
    '<div class="kpi">' +
      '<div class="kpi-label">FT / PT / Casual</div>' +
      '<div class="kpi-value">' + t.ftHrs + "</div>" +
      '<div class="kpi-sub">' + t.ptHrs + " PT &middot; " + t.casHrs + " casual</div>" +
    "</div>";
}

function renderTable() {
  ["wk1","wk2","wk3","wk4","wk5"].forEach(function(id, i) {
    var label = document.getElementById(id + "label").value || ("Wk " + (i+1));
    document.getElementById("th-" + id).textContent = label;
  });
  var tbody = document.getElementById("rosterBody");
  tbody.innerHTML = roster.map(function(p, idx) {
    var hrs  = p.wk.reduce(function(s,h) { return s+(+h||0); }, 0);
    var cost = Math.round(hrs * (p.rate||0));
    var rowClass = (p.type === "FT" ? "ft" : p.type === "PT" ? "pt" : "cas") + "-row";
    var rateCell = '';
    var costCell = '<span style="color:var(--muted);">$' + cost.toLocaleString() + '</span>';
    var wkCells = p.wk.map(function(h, wi) {
      return '<td><input class="hrs-input' + (h==0?" zero":"") + '" type="number" value="' + h + '" min="0" max="80" step="0.5" onchange="updateHrs(' + idx + ',' + wi + ',this.value)" oninput="this.className=\'hrs-input\'+(+this.value==0?\' zero\':\'\');updateHrs(' + idx + ',' + wi + ',this.value)"></td>';
    }).join("");
    return '<tr class="' + rowClass + '" data-idx="' + idx + '">' +
      '<td><input class="name-input" value="' + p.name.replace(/"/g,"&quot;") + '" onchange="updateName(' + idx + ',this.value)"></td>' +
      '<td><span class="type-badge ' + p.type + '" onclick="toggleType(' + idx + ')">' + p.type + '</span></td>' +
      wkCells +
      '<td style="font-weight:700;color:' + (hrs>0?"var(--text)":"var(--muted)") + ';">' + hrs + "</td>" +
      "<td>" + costCell + "</td>" +
      '<td><button onclick="removeRow(' + idx + ')" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 6px;">&times;</button></td>' +
    "</tr>";
  }).join("");

  var t = calcTotals();
  var wkTotals = [0,1,2,3,4].map(function(wi) { return roster.reduce(function(s,p) { return s+(+p.wk[wi]||0); }, 0); });
  document.getElementById("rosterFoot").innerHTML =
    '<tr class="totals-row">' +
    "<td><strong>TOTALS</strong></td><td></td><td></td>" +
    wkTotals.map(function(w) { return '<td style="font-weight:700;color:var(--accent);">' + w + "</td>"; }).join("") +
    '<td style="font-weight:700;color:var(--accent);">' + t.totalHrs + "</td>" +
    "<td><strong>$" + Math.round(t.totalCost).toLocaleString() + "</strong></td>" +
    "<td></td></tr>";
}

function updateName(idx, val) { roster[idx].name = val; deferSave(); }
function updateRate(idx, val) { roster[idx].rate = +val||0; renderKPI(); renderTable(); deferSave(); }
function updateHrs(idx, wi, val) {
  roster[idx].wk[wi] = +val||0;
  renderKPI();
  // Update totals row live
  var t = calcTotals();
  var wkTotals = [0,1,2,3,4].map(function(w) { return roster.reduce(function(s,p) { return s+(+p.wk[w]||0); }, 0); });
  var cells = document.querySelector("#rosterFoot .totals-row");
  if (cells) {
    var tds = cells.querySelectorAll("td");
    tds[3].textContent = wkTotals[0]; tds[4].textContent = wkTotals[1];
    tds[5].textContent = wkTotals[2]; tds[6].textContent = wkTotals[3];
    tds[7].textContent = wkTotals[4]; tds[8].textContent = t.totalHrs;
    tds[9].innerHTML   = "<strong>$" + Math.round(t.totalCost).toLocaleString() + "</strong>";
  }
  deferSave();
}
function toggleType(idx) {
  var cycle = {FT:"PT", PT:"CAS", CAS:"FT"};
  roster[idx].type = cycle[roster[idx].type] || "FT";
  renderKPI(); renderTable(); deferSave();
}
function removeRow(idx) {
  if (roster.length <= 1) return;
  roster.splice(idx, 1);
  renderKPI(); renderTable(); deferSave();
}
function addRow() {
  roster.push({name:"New Person", type:"CAS", rate:30.00, wk:[0,0,0,0,0]});
  renderKPI(); renderTable();
  setTimeout(function() {
    var inputs = document.querySelectorAll(".name-input");
    if (inputs.length) inputs[inputs.length-1].select();
  }, 50);
}
function clearHours() {
  if (!confirm("Clear all planned hours? Names and rates will be kept.")) return;
  roster.forEach(function(p) { p.wk = [0,0,0,0]; });
  renderKPI(); renderTable(); deferSave();
}
function resetAll() {
  if (!confirm("Reset to FY2026 defaults? This cannot be undone.")) return;
  roster = JSON.parse(JSON.stringify(DEFAULT_ROSTER));
  renderKPI(); renderTable(); deferSave();
}

function exportCSV() {
  var month = document.getElementById("planMonth").value || "plan";
  var targetUnits = document.getElementById("targetUnits").value;
  var wkLabels = [1,2,3,4,5].map(function(i) { return document.getElementById("wk"+i+"label").value || "Wk "+i; });
  var t = calcTotals();
  var rows = [];
  rows.push(["Warehouse Hours Plan", month]);
  rows.push(["Target Units", targetUnits]);
  rows.push(["Total Hours", t.totalHrs]);
  rows.push(["Projected Cost", "$"+Math.round(t.totalCost).toLocaleString()]);
  rows.push(["Projected Cost/Unit", t.projCpu ? "$"+t.projCpu.toFixed(2) : "-"]);
  rows.push([]);
  rows.push(["Name","Type",wkLabels[0],wkLabels[1],wkLabels[2],wkLabels[3],wkLabels[4],"Total Hrs","Est. Cost"]);
  roster.forEach(function(p) {
    var hrs  = p.wk.reduce(function(s,h) { return s+(+h||0); }, 0);
    var cost = Math.round(hrs * (p.rate||0));
    rows.push([p.name, p.type, p.wk[0], p.wk[1], p.wk[2], p.wk[3], p.wk[4]||0, hrs, "$"+cost]);
  });
  var wkT = [0,1,2,3,4].map(function(wi) { return roster.reduce(function(s,p) { return s+(+p.wk[wi]||0); }, 0); });
  rows.push(["TOTALS","",wkT[0],wkT[1],wkT[2],wkT[3],wkT[4],t.totalHrs,"$"+Math.round(t.totalCost).toLocaleString()]);
  var csv = rows.map(function(r) {
    return r.map(function(v) {
      var s = String(v == null ? "" : v);
      if (s.indexOf(",") >= 0 || s.indexOf('"') >= 0) s = '"' + s.replace(/"/g, '""') + '"';
      return s;
    }).join(",");
  }).join("\r\n");
  var blob = new Blob([csv], {type:"text/csv"});
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement("a");
  a.href = url; a.download = "warehouse-hours-" + month + ".csv"; a.click();
  URL.revokeObjectURL(url);
}

document.addEventListener("DOMContentLoaded", function() {
  load();
  renderKPI();
  renderTable();
  // Fetch latest rates from cost sheet
  fetchRates();
  ["targetUnits","avgUnits","targetCpu"].forEach(function(id) {
    document.getElementById(id).addEventListener("input", function() { renderKPI(); deferSave(); });
  });
  document.getElementById("planMonth").addEventListener("change", function(e) {
    var parts = e.target.value.split("-");
    var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    document.getElementById("plannerSub").textContent = months[+parts[1]-1] + " " + parts[0] + " \xB7 Warehouse hours plan \xB7 Uni Hill HQ";
    deferSave();
  });
  document.getElementById("planMonth").dispatchEvent(new Event("change"));
});
</script>
</body>
